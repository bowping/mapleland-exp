<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메이플스토리 경험치 측정기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f5f6f7; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #ff9900; margin-top: 0; }
        h3 { border-left: 4px solid #ff9900; padding-left: 10px; margin-top: 25px; }
        .form-group { margin-bottom: 12px; display: flex; align-items: center; }
        label { width: 150px; font-weight: bold; font-size: 14px; }
        input, select { padding: 8px; width: 250px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input:focus, select:focus { border-color: #ff9900; outline: none; }
        
        .checkbox-label { width: auto; cursor: pointer; display: flex; align-items: center; gap: 5px; color: #ef4444; font-size: 14px; }
        .checkbox-label input { width: auto; cursor: pointer; }

        .btn-container { display: flex; gap: 10px; margin-top: 15px; }
        button { padding: 12px 25px; background-color: #ff9900; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px; flex: 1; }
        button:hover { background-color: #e68a00; }
        
        .exp-container { background-color: #e2e8f0; border-radius: 20px; width: 100%; height: 25px; overflow: hidden; margin-top: 10px; position: relative; border: 1px solid #cbd5e1; }
        .exp-bar { background: linear-gradient(to right, #ffb347, #ffcc33); height: 100%; width: 0%; transition: width 0.5s ease-in-out; }
        .exp-text { position: absolute; width: 100%; text-align: center; top: 3px; font-size: 13px; font-weight: bold; color: #334155; text-shadow: 1px 1px 1px white; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #f9f9f9; font-weight: bold; }
        
        .delete-btn { padding: 4px 8px; background-color: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .delete-btn:hover { background-color: #dc2626; }

        .total-box { background-color: #fff4e6; padding: 15px; border-radius: 6px; margin-top: 15px; font-size: 16px; border: 1px solid #ffe8cc; }
        .total-box strong { color: #ff9900; }
    </style>
</head>
<body>

<div class="container">
    <h2>🍁 메이플스토리 경험치 측정기</h2>
    <p style="color:#666; font-size:13px;">※ 모든 기록은 접속하신 브라우저 내부(LocalStorage)에 안전하게 자동 저장됩니다. (단, 인터넷 사용기록 삭제시 모두삭제)</p>
    <hr>

    <h3>📝 사냥 기록 입력</h3>
    <form id="expForm">
        <div class="form-group">
            <label for="date">사냥 날짜:</label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label for="charName">캐릭터 이름:</label>
            <input type="text" id="charName" placeholder="예: 후바스탱크" required>
        </div>
        <div class="form-group">
            <label for="charLevel">현재 캐릭터 레벨:</label>
            <select id="charLevel"></select>
        </div>
        <div class="form-group">
            <label for="huntingGround">사냥터:</label>
            <input type="text" id="huntingGround" placeholder="예: 켄타우로스의 원탁(이하 원탁)" required>
        </div>
        <div class="form-group">
            <label for="huntingTime">사냥 시간 (분):</label>
            <input type="number" id="huntingTime" placeholder="예: 60, 120" min="1" required>
        </div>
        
        <div class="form-group">
            <label for="startExp">시작 경험치 수치:</label>
            <input type="text" id="startExp" placeholder="예: 10,000,000" required>
        </div>
        <div class="form-group">
            <label for="endExp">종료 경험치 수치:</label>
            <input type="text" id="endExp" placeholder="예: 50,000,000" required>
        </div>

        <div class="form-group">
            <label></label>
            <label class="checkbox-label" for="isLevelUp">
                <input type="checkbox" id="isLevelUp"> <strong>⚠️ 이번 사냥 도중 레벨업을 했습니다!</strong>
            </label>
        </div>
        
        <div class="btn-container">
            <button type="button" id="saveBtn">💾 기록하기</button>
        </div>
    </form>

    <h3>📊 실시간 경험치 게이지</h3>
    <div id="gaugeCharacterName" style="font-weight: bold; font-size: 15px; margin-bottom: 5px; color: #ff9900;">캐릭터를 등록해 주세요</div>
    <div class="exp-container">
        <div class="exp-bar" id="expProgressBar"></div>
        <div class="exp-text" id="expProgressText">0% (0 / 0)</div>
    </div>

    <div class="total-box">
        누적 총 획득 경험치: <strong id="totalExpDisplay">0 exp</strong>
    </div>
    
    <h3>📜 사냥 로그 목록 (최신순)</h3>
    <table>
        <thead>
            <tr>
                <th>기록 시간</th>
                <th>캐릭터명 (레벨)</th>
                <th>사냥터</th>
                <th>사냥 시간</th>
                <th>획득 경험치 (퍼센트)</th>
                <th>시작 경험치 (이전)</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody id="expTableBody">
            </tbody>
    </table>
</div>

<script>
    const expTableData = {
        1:15, 2:34, 3:57, 4:92, 5:135, 6:172, 7:256, 8:372, 9:560, 10:884,
        11:1091, 12:1242, 13:1017, 14:1161, 15:1123, 16:601, 17:232, 18:161, 19:342, 20:200,
        21:1454, 22:1601, 23:570, 24:501, 25:688, 26:401, 27:711, 28:040, 29:181, 30:371,
        31:619, 32:166, 33:802, 34:020, 35:216, 36:212, 37:440, 38:222, 39:289, 40:802,
        41:334, 42:320, 43:244, 44:051, 45:222, 46:554, 47:900, 48:265, 49:721, 50:027,
        51:636, 52:662, 53:873, 54:080, 55:298, 56:327, 57:030, 58:957, 59:003, 60:110,
        61:8480, 62:122760, 63:138666, 64:155540, 65:174216, 66:194832, 67:216600, 68:240550, 69:266682, 70:294216,
        71:324240, 72:356916, 73:391160, 74:428280, 75:468450, 76:510420, 77:555680, 78:604416, 79:655200, 80:709716,
        81:748608, 82:789631, 83:832902, 84:878545, 85:926689, 86:977471, 87:1031036, 88:1087536, 89:1147132, 90:1209904,
        91:1276301, 92:1346242, 93:1420016, 94:1497832, 95:1579913, 96:1666492, 97:1757185, 98:1854143, 99:1955750, 100:2062925,
        101:10783397, 102:11374327, 103:11997640, 104:12655575, 105:13348610, 106:14080113, 107:14851703, 108:15665676, 109:16524049, 110:17429556,
        111:18384706, 112:19392187, 113:20454878, 114:21575805, 115:22758159, 116:24005306, 117:25320796, 118:26708375, 119:28171993, 120:29715818,
        121:31344244, 122:33061908, 123:34873700, 124:36784778, 125:38800583, 126:40926854, 127:43169645, 128:45535341, 129:48030677, 130:50662758,
        131:53439077, 132:56367538, 133:59456479, 134:62714694, 135:66151459, 136:69776558, 137:73600313, 138:77633610, 139:81887931, 140:86375389,
        141:91108760, 142:96101520, 143:101367883, 144:106922842, 145:112782213, 146:118962678, 147:125481832, 148:132358236, 149:139611467, 150:147262175,
        151:155332142, 152:163844343, 153:172823102, 154:182293713, 155:192283408, 156:202820583, 157:213935103, 158:225658746, 159:238024845, 160:251068606,
        161:264827165, 162:289339693, 163:294647508, 164:310794191, 165:327825712, 166:345790561, 167:364729883, 168:384727628, 169:405810702, 170:428049128,
        171:451506220, 172:476248760, 173:502347192, 174:529875818, 175:558913012, 176:589531012, 177:621848316, 178:655925603, 179:691870326, 180:729784819,
        181:769777027, 182:811960808, 183:856456260, 184:903390063, 185:952895838, 186:1005114529, 187:1060194805, 188:1118293480, 189:1179575962, 190:1244216724,
        191:1312399800, 192:1384319309, 193:1469180007, 194:1540197371, 195:1624600724, 196:1713628833, 197:1807535693, 198:1906588643, 199:2011069705
    };

    function getTodayString() {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function formatNumberWithCommas(value) {
        if (!value) return '';
        const num = value.toString().replace(/[^0-9]/g, '');
        return num.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function getPureNumber(value) {
        return parseFloat(value.replace(/,/g, ''));
    }

    const startExpInput = document.getElementById('startExp');
    const endExpInput = document.getElementById('endExp');
    const isLevelUpCheckbox = document.getElementById('isLevelUp');

    startExpInput.addEventListener('input', function(e) { e.target.value = formatNumberWithCommas(e.target.value); });
    endExpInput.addEventListener('input', function(e) { e.target.value = formatNumberWithCommas(e.target.value); });

    const levelSelect = document.getElementById('charLevel');
    for (let lvl = 1; lvl <= 199; lvl++) {
        let opt = document.createElement('option');
        opt.value = lvl;
        opt.textContent = `${lvl} 레벨`;
        levelSelect.appendChild(opt);
    }
    levelSelect.value = 164; 
    document.getElementById('date').value = getTodayString();

    let huntingLogs = JSON.parse(localStorage.getItem('mapleHuntingLogs')) || [];
    
    setupStartExpFromLastLog();
    renderLogs();

    function setupStartExpFromLastLog() {
        if (huntingLogs.length > 0) {
            const lastLog = huntingLogs[huntingLogs.length - 1];
            startExpInput.value = formatNumberWithCommas(lastLog.endExp);
        } else {
            startExpInput.value = '';
        }
    }

    // 💾 기록하기 버튼 클릭
    document.getElementById('saveBtn').addEventListener('click', function() {
        let dateInput = document.getElementById('date').value;
        const charName = document.getElementById('charName').value;
        const level = parseInt(document.getElementById('charLevel').value);
        const huntingGround = document.getElementById('huntingGround').value;
        const huntingTime = document.getElementById('huntingTime').value;
        
        const startExp = getPureNumber(startExpInput.value);
        const endExp = getPureNumber(endExpInput.value);
        const maxExpForLevel = expTableData[level];
        const isLevelUpLog = isLevelUpCheckbox.checked;

        if (!dateInput || !charName || !huntingGround || !huntingTime || isNaN(startExp) || isNaN(endExp)) {
            alert('모든 칸을 올바르게 입력해주세요!');
            return;
        }

        if (startExp > maxExpForLevel) {
            alert(`시작 경험치가 현재 ${level}레벨의 최대 필요 경험치(${maxExpForLevel.toLocaleString()})를 초과할 수 없습니다.`);
            return;
        }

        let expGained = 0;

        if (isLevelUpLog) {
            expGained = (maxExpForLevel - startExp) + endExp;
            const nextLevelMax = expTableData[level + 1] || maxExpForLevel;
            if (endExp > nextLevelMax) {
                alert(`종료 경험치가 다음 레벨의 최대 필요 경험치(${nextLevelMax.toLocaleString()})를 초과할 수 없습니다.`);
                return;
            }
        } else {
            if (endExp > maxExpForLevel) {
                alert(`종료 경험치가 현재 ${level}레벨의 최대 필요 경험치(${maxExpForLevel.toLocaleString()})를 초과할 수 없습니다.`);
                return;
            }
            expGained = endExp - startExp;
            if (expGained < 0) {
                alert('레벨업을 하지 않았다면, 종료 경험치가 시작 경험치보다 적을 수 없습니다.\n만약 레벨업을 하셨다면 [이번 사냥 도중 레벨업을 했습니다] 체크박스를 선택해주세요!');
                return;
            }
        }

        const now = new Date();
        const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        
        if (dateInput === localStorage.getItem('lastCheckedDate')) {
            dateInput = getTodayString();
        }
        const fullDateTime = `${dateInput} ${timeString}`;

        const newLog = {
            id: Date.now(), 
            fullDateTime, charName, level, huntingGround, huntingTime, startExp, endExp, expGained, isLevelUpLog
        };

        huntingLogs.push(newLog);
        localStorage.setItem('mapleHuntingLogs', JSON.stringify(huntingLogs));

        renderLogs();
        
        const freshToday = getTodayString();
        document.getElementById('date').value = freshToday;
        localStorage.setItem('lastCheckedDate', freshToday);

        // ⚡ [알림창 메시지 기획 수정 반영]
        if (isLevelUpLog) {
            if (level < 199) {
                alert(`🎉 레벨업 사냥 기록이 완료되었습니다!\n레벨 선택창이 [${level + 1} 레벨]로 변경되며, 방금 입력한 종료 경험치(${endExp.toLocaleString()})가 다음 사냥의 시작 경험치로 자동 입력됩니다.`);
                levelSelect.value = level + 1;
            }
        }

        // 다음 사냥을 위해 시작 경험치 연동 및 종료 경험치 초기화
        startExpInput.value = formatNumberWithCommas(endExp);
        endExpInput.value = '';
        isLevelUpCheckbox.checked = false;
    });

    // 개별 로그 삭제
    function deleteLog(id, charName) {
        if (confirm(`[${charName}] 캐릭터의 해당 사냥 기록을 정말 삭제하시겠습니까?`)) {
            huntingLogs = huntingLogs.filter(log => log.id !== id);
            localStorage.setItem('mapleHuntingLogs', JSON.stringify(huntingLogs));
            renderLogs();
            setupStartExpFromLastLog();
        }
    }

    // 📊 화면 그리기 함수
    function renderLogs() {
        const tableBody = document.getElementById('expTableBody');
        tableBody.innerHTML = ''; 
        let cumulativeTotalExp = 0;

        if (huntingLogs.length === 0) {
            tableBody.innerHTML = `<tr id="emptyRow"><td colspan="7" style="color: #999;">아직 등록된 사냥 기록이 없습니다.</td></tr>`;
            document.getElementById('totalExpDisplay').innerText = "0 exp";
            document.getElementById('gaugeCharacterName').innerText = "캐릭터를 등록해 주세요";
            document.getElementById('expProgressBar').style.width = '0%';
            document.getElementById('expProgressText').innerText = '0% (0 / 0)';
            return;
        }

        huntingLogs.forEach(log => { cumulativeTotalExp += log.expGained; });

        const latestLog = huntingLogs[huntingLogs.length - 1];
        
        let displayLevel = latestLog.level;
        let displayExp = latestLog.endExp;
        if (latestLog.isLevelUpLog && latestLog.level < 199) {
            displayLevel = latestLog.level + 1;
        }
        
        const latestMaxExp = expTableData[displayLevel];
        const latestEndPercent = (displayExp / latestMaxExp) * 100;
        
        document.getElementById('gaugeCharacterName').innerText = `🍁 ${latestLog.charName} (Lv.${displayLevel}) 현재 경험치 상태`;
        document.getElementById('expProgressBar').style.width = `${latestEndPercent}%`;
        document.getElementById('expProgressText').innerText = `${latestEndPercent.toFixed(2)}% (${displayExp.toLocaleString()} / ${latestMaxExp.toLocaleString()})`;
        document.getElementById('totalExpDisplay').innerText = cumulativeTotalExp.toLocaleString() + " exp";

        const reversedLogs = [...huntingLogs].reverse();

        reversedLogs.forEach(log => {
            const maxExp = expTableData[log.level];
            const startPercent = (log.startExp / maxExp) * 100;
            
            let percentageMarkup = '';
            if (log.isLevelUpLog) {
                percentageMarkup = `<span style="color: #ef4444; font-size: 12px; font-weight: bold;">(레벨업 포함)</span>`;
            } else {
                const endPercent = (log.endExp / maxExp) * 100;
                const gainedPercent = endPercent - startPercent;
                percentageMarkup = `<span style="color: #2563eb; font-size: 12px;">(+${gainedPercent.toFixed(2)}%)</span>`;
            }

            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td style="color: #555; font-size: 13px;">${log.fullDateTime}</td>
                <td>${log.charName} (Lv.${log.level}${log.isLevelUpLog ? ' → ' + (log.level+1) : ''})</td>
                <td>${log.huntingGround}</td>
                <td>${log.huntingTime}분</td>
                <td>
                    <span style="color: #e68a00; font-weight: bold;">+${log.expGained.toLocaleString()}</span><br>
                    ${percentageMarkup}
                </td>
                <td style="color: #666;">${log.startExp.toLocaleString()} (${startPercent.toFixed(2)}%)</td>
                <td>
                    <button class="delete-btn" onclick="deleteLog(${log.id}, '${log.charName}')">삭제</button>
                </td>
            `;
            tableBody.appendChild(newRow);
        });
    }
</script>

</body>
</html>
