<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메이플스토리 경험치 측정기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f5f6f7; color: #333; }
        .container { max-width: 1050px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #ff9900; margin-top: 0; }
        h3 { border-left: 4px solid #ff9900; padding-left: 10px; margin-top: 25px; }
        .form-group { margin-bottom: 12px; display: flex; align-items: center; }
        label { width: 150px; font-weight: bold; font-size: 14px; }
        
        input, select, .info-display { padding: 8px; width: 250px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input:focus, select:focus { border-color: #ff9900; outline: none; }
        
        .info-display { font-size: 14px; font-weight: bold; color: #4b5563; background-color: #f3f4f6; display: inline-block; border: 1px solid #e5e7eb; }

        #customHuntingGroundWrapper { display: none; margin-top: 8px; }

        .checkbox-label { width: auto; cursor: pointer; display: flex; align-items: center; gap: 5px; color: #ef4444; font-size: 14px; }
        .checkbox-label input { width: auto; cursor: pointer; }

        .btn-container { 
            display: flex; 
            margin-top: 15px; 
            width: 100%; 
        }
        button { 
            padding: 12px 25px; 
            background-color: #ff9900; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 15px; 
            width: 100%; 
            box-sizing: border-box; 
        }
        button:hover { background-color: #e68a00; }
        
        /* ------------------------------------------------------------------- */
        /* 🎮 메이플스토리 인게임 경험치바 UI */
        /* ------------------------------------------------------------------- */
        .maple-ui-wrapper {
            background-color: #2d3238; 
            padding: 12px 16px 16px 16px;
            border-radius: 6px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.1), 0 4px 6px rgba(0,0,0,0.3);
            width: 100%; 
            box-sizing: border-box;
            margin-top: 10px;
        }

        .maple-ui-text-row {
            display: flex;
            align-items: baseline;
            margin-bottom: 8px;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
        }

        .maple-ui-exp-logo {
            font-size: 16px;
            color: #ffffff;
            font-weight: 900;
            font-style: italic;
            margin-right: 8px;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 2px 2px 2px rgba(0,0,0,0.7);
        }

        .maple-ui-exp-val {
            font-size: 14px;
            color: #ffffff;
            margin-right: 6px;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .maple-ui-exp-pct {
            font-size: 14px;
            color: #a2e026; 
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .maple-ui-bar-outer {
            width: 100%;
            height: 20px;
            background: linear-gradient(180deg, #515457 0%, #3a3d40 50%, #484b4e 100%); 
            border: 2px solid #18191b;
            border-radius: 4px;
            box-shadow: inset 0 2px 3px rgba(0,0,0,0.6), 0 1px 0px rgba(255,255,255,0.2);
            position: relative;
            overflow: hidden;
        }

        .maple-ui-bar-inner {
            height: 100%;
            width: 0%; 
            background: linear-gradient(180deg, #e4ff00 0%, #b4ff00 40%, #76df00 80%, #59c000 100%);
            box-shadow: inset 0 2px 2px rgba(255,255,255,0.6), inset -1px 0 2px rgba(0,0,0,0.3);
            border-right: 1px solid #222;
            transition: width 0.4s ease-out;
        }

        .maple-ui-ticks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .maple-ui-tick {
            width: 1px;
            height: 4px;
            background-color: #222222;
            align-self: flex-end;
            margin-bottom: 1px;
            opacity: 0.7;
        }
        .maple-ui-tick:first-child, .maple-ui-tick:last-child { opacity: 0; }
        /* ------------------------------------------------------------------- */

        .total-box { background-color: #fff4e6; padding: 15px; border-radius: 6px; margin-top: 15px; font-size: 16px; border: 1px solid #ffe8cc; }
        .total-box strong { color: #ff9900; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 15px; table-layout: fixed; }
        th, td { border: 1px solid #ddd; padding: 10px 4px; text-align: center; word-break: break-all; }
        th { background-color: #f9f9f9; font-weight: bold; }
        
        .table-input { padding: 4px; width: 95%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; text-align: center; font-size: 12px; }
        .table-input:focus { border-color: #ff9900; outline: none; }

        .edit-btn, .save-btn, .cancel-btn, .delete-btn { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; width: auto !important; }
        .edit-btn { background-color: #3b82f6; color: white; margin: 2px 4px 2px 0; }
        .edit-btn:hover { background-color: #2563eb; }
        .save-btn { background-color: #10b981; color: white; margin: 2px 4px 2px 0; }
        .save-btn:hover { background-color: #059669; }
        .cancel-btn { background-color: #6b7280; color: white; margin: 2px 4px 2px 0; }
        .cancel-btn:hover { background-color: #4b5563; }
        .delete-btn { background-color: #ef4444; color: white; margin: 2px 0; }
        .delete-btn:hover { background-color: #dc2626; }
        
        col:nth-child(1) { width: 17%; }
        col:nth-child(2) { width: 14%; }
        col:nth-child(3) { width: 16%; }
        col:nth-child(4) { width: 9%; }
        col:nth-child(5) { width: 16%; }
        col:nth-child(6) { width: 15%; }
        col:nth-child(7) { width: 13%; }
    </style>
</head>
<body>

<div class="container">
    <h2>🍁 메이플스토리 경험치 측정기</h2>
    <p style="color:#666; font-size:13px;">※ 모든 기록은 브라우저 내부에 저장되므로, 인터넷 쿠키/사용 기록을 삭제하면 로그가 함께 지워질 수 있으니 주의해 주세요!</p>
    <hr>

    <h3>📝 사냥 기록 입력</h3>
    <form id="expForm">
        <div class="form-group">
            <label for="todaySelect">오늘 날짜:</label>
            <select id="todaySelect" disabled></select>
        </div>
        <div class="form-group">
            <label for="charName">캐릭터 이름:</label>
            <input type="text" id="charName" placeholder="예: 후바스탱크" oninput="updateLevelSelectOptions()" required>
        </div>
        <div class="form-group">
            <label for="charLevelSelect">현재 캐릭터 레벨:</label>
            <select id="charLevelSelect"></select>
        </div>
        
        <div class="form-group" style="align-items: flex-start; flex-direction: column;">
            <div style="display: flex; align-items: center; width: 100%;">
                <label for="huntingGroundSelect">사냥터 선택:</label>
                <select id="huntingGroundSelect">
                    <option value="켄타우로스의 원탁">켄타우로스의 원탁</option>
                    <option value="위험한 용의 둥지">위험한 용의 둥지</option>
                    <option value="망가진 용의 둥지">망가진 용의 둥지</option>
                    <option value="큰 둥지 봉우리">큰 둥지 봉우리</option>
                    <option value="custom">그 외 직접 사냥터 입력</option>
                </select>
            </div>
            <div id="customHuntingGroundWrapper" style="padding-left: 150px; width: 100%; box-sizing: border-box;">
                <input type="text" id="customHuntingGround" placeholder="사냥터 이름을 직접 입력해 주세요">
            </div>
        </div>

        <div class="form-group">
            <label for="huntingTime">사냥 시간 (분):</label>
            <input type="number" id="huntingTime" placeholder="예: 30, 60, 120" min="1" required>
        </div>
        
        <div class="form-group">
            <label for="startExp">시작 경험치 수치:</label>
            <input type="text" id="startExp" placeholder="예: 10,000,000" required>
        </div>
        <div class="form-group">
            <label for="endExp">종료 경험치 수치:</label>
            <input type="text" id="endExp" placeholder="예: 50,000,000" required>
        </div>

        <div class="form-group">
            <label></label>
            <label class="checkbox-label" for="isLevelUp">
                <input type="checkbox" id="isLevelUp"> <strong>⚠️ 이번 사냥 도중 레벨업을 했습니다!</strong>
            </label>
        </div>
        
        <div class="btn-container">
            <button type="button" id="saveBtn">💾 기록하기</button>
        </div>
    </form>

    <h3>📊 실시간 경험치 게이지</h3>
    <div id="gaugeCharacterName" style="font-weight: bold; font-size: 14px; margin-bottom: 8px; color: #e68a00;">캐릭터를 등록해 주세요</div>
    
    <div class="maple-ui-wrapper">
        <div class="maple-ui-text-row">
            <span class="maple-ui-exp-logo">EXP.</span>
            <span class="maple-ui-exp-val" id="mapleExpValue">0 / 0</span>
            <span class="maple-ui-exp-pct" id="mapleExpPercent">[0.00%]</span>
        </div>
        <div class="maple-ui-bar-outer">
            <div class="maple-ui-bar-inner" id="mapleExpBarInner"></div>
            <div class="maple-ui-ticks">
                <div class="maple-ui-tick"></div><div class="maple-ui-tick"></div>
                <div class="maple-ui-tick"></div><div class="maple-ui-tick"></div>
                <div class="maple-ui-tick"></div><div class="maple-ui-tick"></div>
                <div class="maple-ui-tick"></div><div class="maple-ui-tick"></div>
                <div class="maple-ui-tick"></div><div class="maple-ui-tick"></div>
                <div class="maple-ui-tick"></div>
            </div>
        </div>
    </div>

    <div class="total-box">
        누적 총 획득 경험치: <strong id="totalExpDisplay">0 exp</strong>
    </div>
    
    <h3>📋 사냥 히스토리 로그</h3>
    <table>
        <colgroup>
            <col><col><col><col><col><col><col>
        </colgroup>
        <thead>
            <tr>
                <th>기록 시간</th>
                <th>캐릭터명 (레벨)</th>
                <th>사냥터</th>
                <th>사냥 시간</th>
                <th>획득 경험치</th>
                <th>시작 경험치 (비율)</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody id="expTableBody">
            </tbody>
    </table>

</div>

<script>
    const expTableData = {
        1:15, 2:34, 3:57, 4:92, 5:135, 6:172, 7:256, 8:372, 9:560, 10:884,
        11:1091, 12:1242, 13:1017, 14:1161, 15:1123, 16:601, 17:232, 18:161, 19:342, 20:200,
        21:1454, 22:1601, 23:570, 24:501, 25:688, 26:401, 27:711, 28:040, 29:181, 30:371,
        31:619, 32:166, 33:802, 34:020, 35:216, 36:212, 37:440, 38:222, 39:289, 40:802,
        41:334, 42:320, 43:244, 44:051, 45:222, 46:554, 47:900, 48:265, 49:721, 50:027,
        51:636, 52:662, 53:873, 54:080, 55:298, 56:327, 57:030, 58:957, 59:003, 60:110,
        61:8480, 62:122760, 63:138666, 64:155540, 65:174216, 66:194832, 67:216600, 68:240550, 69:266682, 70:294216,
        71:324240, 72:356916, 73:391160, 74:428280, 75:468450, 76:510420, 77:555680, 78:604416, 79:655200, 80:709716,
        81:748608, 82:789631, 83:832902, 84:878545, 85:926689, 86:977471, 87:1031036, 88:1087536, 89:1147132, 90:1209904,
        91:1276301, 92:1346242, 93:1420016, 94:1497832, 95:1579913, 96:1666492, 97:1757185, 98:1854143, 99:1955750, 100:2062925,
        101:10783397, 102:11374327, 103:11997640, 104:12655575, 105:13348610, 106:14080113, 107:14851703, 108:15665676, 109:16524049, 110:17429556,
        111:18384706, 112:19392187, 113:20454878, 114:21575805, 115:22758159, 116:24005306, 117:25320796, 118:26708375, 119:28171993, 120:29715818,
        121:31344244, 122:33061908, 123:34873700, 124:36784778, 125:38800583, 126:40926854, 127:43169645, 128:45535341, 129:48030677, 130:50662758,
        131:53439077, 132:56367538, 133:59456479, 134:62714694, 135:66151459, 136:69776558, 137:73600313, 138:77633610, 139:81887931, 140:86375389,
        141:91108760, 142:96101520, 143:101367883, 144:106922842, 145:112782213, 146:118962678, 147:125481832, 148:132358236, 149:139611467, 150:147262175,
        151:155332142, 152:163844343, 153:172823102, 154:182293713, 155:192283408, 156:202820583, 157:213935103, 158:225658746, 159:238024845, 160:251068606,
        161:264827165, 162:289339693, 163:294647508, 164:310794191, 165:327825712, 166:345790561, 167:364729883, 168:384727628, 169:405810702, 170:428049128,
        171:451506220, 172:476248760, 173:502347192, 174:529875818, 175:558913012, 176:589531012, 177:621848316, 178:655925603, 179:691870326, 180:729784819,
        181:769777027, 182:811960808, 183:856456260, 184:903390063, 185:952895838, 186:1005114529, 187:1060194805, 188:1118293480, 189:1179575962, 190:1244216724,
        191:1312399800, 192:1384319309, 193:1469180007, 194:1540197371, 195:1624600724, 196:1713628833, 197:1807535693, 198:1906588643, 199:2011069705
    };

    function getTodayString() {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function initTodaySelect() {
        const todayStr = getTodayString();
        const todaySelect = document.getElementById('todaySelect');
        todaySelect.innerHTML = `<option value="${todayStr}">${todayStr}</option>`;
    }

    function getCurrentDateTimeLocalString() {
        const now = new Date();
        const offset = now.getTimezoneOffset() * 60000;
        return (new Date(now - offset)).toISOString().slice(0, 16);
    }

    function formatNumberWithCommas(value) {
        if (!value) return '';
        return value.toString().replace(/[^0-9]/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function getPureNumber(value) {
        return parseFloat(value.toString().replace(/,/g, ''));
    }

    const startExpInput = document.getElementById('startExp');
    const endExpInput = document.getElementById('endExp');
    const isLevelUpCheckbox = document.getElementById('isLevelUp');
    const charNameInput = document.getElementById('charName'); 
    const charLevelSelect = document.getElementById('charLevelSelect');
    
    const huntingGroundSelect = document.getElementById('huntingGroundSelect');
    const customHuntingGroundWrapper = document.getElementById('customHuntingGroundWrapper');
    const customHuntingGroundInput = document.getElementById('customHuntingGround');

    startExpInput.addEventListener('input', function(e) { e.target.value = formatNumberWithCommas(e.target.value); });
    endExpInput.addEventListener('input', function(e) { e.target.value = formatNumberWithCommas(e.target.value); });

    huntingGroundSelect.addEventListener('change', function() {
        if (huntingGroundSelect.value === 'custom') {
            customHuntingGroundWrapper.style.display = 'block'; 
            customHuntingGroundInput.required = true;
        } else {
            customHuntingGroundWrapper.style.display = 'none';  
            customHuntingGroundInput.required = false;
            customHuntingGroundInput.value = ''; 
        }
    });

    let editingLogId = null; 
    initTodaySelect();
    let huntingLogs = JSON.parse(localStorage.getItem('mapleHuntingLogs')) || [];
    
    setupInputsFromLastLog();
    renderLogs();

    function updateLevelSelectOptions() {
        const typedName = charNameInput.value.trim();
        
        if (!typedName) {
            // ⭐ 이름이 없을 때 기본 범위를 1~199로 열어주되, 기본 선택(Default)을 164로 세팅합니다.
            buildSelectRange(1, 199, 164);
            return;
        }

        const charLogs = huntingLogs.filter(log => log.charName === typedName);

        if (charLogs.length > 0) {
            const lastLog = charLogs[charLogs.length - 1];
            let currentCalculatedLevel = lastLog.level;
            if (lastLog.isLevelUpLog && lastLog.level < 199) {
                currentCalculatedLevel = lastLog.level + 1;
            }
            buildSelectRange(currentCalculatedLevel, currentCalculatedLevel, currentCalculatedLevel);
        } else {
            // ⭐ 저장소에 매칭되는 캐릭터 기록이 없을 때도 초기 선택은 164로 유지합니다.
            buildSelectRange(1, 199, 164);
        }
    }

    function buildSelectRange(min, max, defaultValue) {
        const currentSelectedValue = charLevelSelect.value; 
        charLevelSelect.innerHTML = ''; 

        for (let i = min; i <= max; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `${i} 레벨`;
            charLevelSelect.appendChild(opt);
        }

        if (defaultValue) {
            charLevelSelect.value = defaultValue;
        } else if (currentSelectedValue && currentSelectedValue >= min && currentSelectedValue <= max) {
            charLevelSelect.value = currentSelectedValue;
        }
    }

    function setupInputsFromLastLog() {
        if (huntingLogs.length > 0) {
            const lastLog = huntingLogs[huntingLogs.length - 1];
            charNameInput.value = lastLog.charName; 
            startExpInput.value = formatNumberWithCommas(lastLog.endExp); 
        } else {
            charNameInput.value = '';
            startExpInput.value = '';
        }
        updateLevelSelectOptions();
    }

    document.getElementById('saveBtn').addEventListener('click', function() {
        const dateInput = document.getElementById('todaySelect').value; 
        const charName = charNameInput.value.trim(); 
        const level = parseInt(charLevelSelect.value); 
        const huntingTime = document.getElementById('huntingTime').value;
        
        let huntingGround = huntingGroundSelect.value;
        if (huntingGround === 'custom') {
            huntingGround = customHuntingGroundInput.value.trim();
        }
        
        const startExp = getPureNumber(startExpInput.value);
        const endExp = getPureNumber(endExpInput.value);
        
        if (!charName || isNaN(level) || !huntingGround || !huntingTime || isNaN(startExp) || isNaN(endExp)) {
            alert('모든 칸을 올바르게 입력해주세요!');
            return;
        }

        const maxExpForLevel = expTableData[level];
        const isLevelUpLog = isLevelUpCheckbox.checked;

        const charLogs = huntingLogs.filter(log => log.charName === charName);
        if (charLogs.length > 0) {
            const lastCharLog = charLogs[charLogs.length - 1];
            if (startExp !== lastCharLog.endExp) {
                const confirmProceed = confirm(
                    `⚠️ [${charName}] 캐릭터 경험치 불일치 경고!\n\n시스템에 저장된 이 캐릭터의 최종 경험치는 [ ${lastCharLog.endExp.toLocaleString()} ] 입니다.\n현재 입력한 시작 경험치는 [ ${startExp.toLocaleString()} ] 입니다.\n\n이대로 강제 기록을 진행하시겠습니까?`
                );
                if (!confirmProceed) return;
            }
        }

        if (startExp > maxExpForLevel) {
            alert(`시작 경험치가 현재 ${level}레벨의 최대 필요 경험치(${maxExpForLevel.toLocaleString()})를 초과할 수 없습니다.`);
            return;
        }

        let expGained = 0;
        if (isLevelUpLog) {
            expGained = (maxExpForLevel - startExp) + endExp;
            const nextLevelMax = expTableData[level + 1] || maxExpForLevel;
            if (endExp > nextLevelMax) {
                alert(`종료 경험치가 다음 레벨의 최대 필요 경험치(${nextLevelMax.toLocaleString()})를 초과할 수 없습니다.`);
                return;
            }
        } else {
            if (endExp > maxExpForLevel) {
                alert(`종료 경험치가 현재 ${level}레벨의 최대 필요 경험치(${maxExpForLevel.toLocaleString()})를 초과할 수 없습니다.`);
                return;
            }
            expGained = endExp - startExp;
            if (expGained < 0) {
                alert('레벨업을 하지 않았다면, 종료 경험치가 시작 경험치보다 적을 수 없습니다.\n만약 레벨업을 하셨다면 [이번 사냥 도중 레벨업을 했습니다] 체크박스를 선택해주세요!');
                return;
            }
        }

        const now = new Date();
        const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        const fullDateTime = `${dateInput} ${timeString}`;

        const newLog = {
            id: Date.now(), 
            fullDateTime, dateOnly: dateInput, charName, level, huntingGround, huntingTime: parseInt(huntingTime), startExp, endExp, expGained, isLevelUpLog
        };

        huntingLogs.push(newLog);
        localStorage.setItem('mapleHuntingLogs', JSON.stringify(huntingLogs));

        if (isLevelUpLog && level < 199) {
            alert(`🎉 [${charName}] 레벨업 기록 완료!\n다음 사냥 시 입력창레벨은 자동으로 [${level + 1} 레벨] 하나만 선택되도록 고정됩니다.`);
        }

        renderLogs();

        startExpInput.value = formatNumberWithCommas(endExp);
        endExpInput.value = '';
        isLevelUpCheckbox.checked = false;
        
        customHuntingGroundInput.value = '';
        if (huntingGroundSelect.value === 'custom') {
            huntingGroundSelect.value = '켄타우로스의 원탁';
            customHuntingGroundWrapper.style.display = 'none';
        }
        updateLevelSelectOptions();
    });

    function startEditLog(id) { editingLogId = id; renderLogs(); }
    function cancelEditLog() { editingLogId = null; renderLogs(); }

    function saveEditLog(id) {
        const logIndex = huntingLogs.findIndex(log => log.id === id);
        if (logIndex === -1) return;

        const originalLog = huntingLogs[logIndex];
        
        const editDateTimeRaw = document.getElementById(`editDateTime-${id}`).value; 
        const editCharName = document.getElementById(`editCharName-${id}`).value.trim();
        const editLevel = parseInt(document.getElementById(`editLevel-${id}`).value); 
        const editTime = document.getElementById(`editTime-${id}`).value;
        const editStartExp = getPureNumber(document.getElementById(`editStartExp-${id}`).value);
        const editEndExp = getPureNumber(document.getElementById(`editEndExp-${id}`).value);
        
        const selectMenu = document.getElementById(`editGroundSelect-${id}`);
        let editGround = selectMenu.value;
        if (editGround === 'custom') {
            editGround = document.getElementById(`editGroundCustom-${id}`).value.trim();
        }

        if (!editDateTimeRaw || !editCharName || isNaN(editLevel) || !editGround || !editTime || isNaN(editStartExp) || isNaN(editEndExp)) {
            alert('모든 수정 항목을 올바르게 입력해주세요!');
            return;
        }

        if (editLevel < 1 || editLevel > 199) {
            alert('레벨은 1부터 199 사이로 입력해 주세요.');
            return;
        }

        const maxExpForLevel = expTableData[editLevel]; 

        const chosenDateTime = new Date(editDateTimeRaw);
        if (chosenDateTime > new Date()) {
            alert('❌ 미래의 시간으로 기록을 수정할 수 없습니다!');
            return;
        }

        if (editStartExp > maxExpForLevel) {
            alert(`시작 경험치가 해당 레벨(${editLevel}Lv)의 최대 필요 경험치(${maxExpForLevel.toLocaleString()})를 초과할 수 없습니다.`);
            return;
        }

        let expGained = 0;
        if (originalLog.isLevelUpLog) {
            expGained = (maxExpForLevel - editStartExp) + editEndExp;
        } else {
            if (editEndExp > maxExpForLevel) {
                alert(`종료 경험치가 해당 레벨(${editLevel}Lv)의 최대 필요 경험치(${maxExpForLevel.toLocaleString()})를 초과할 수 없습니다.`);
                return;
            }
            expGained = editEndExp - editStartExp;
        }

        huntingLogs[logIndex].fullDateTime = editDateTimeRaw.replace('T', ' ');
        huntingLogs[logIndex].dateOnly = editDateTimeRaw.split('T')[0];
        huntingLogs[logIndex].charName = editCharName;
        huntingLogs[logIndex].level = editLevel; 
        huntingLogs[logIndex].huntingGround = editGround;
        huntingLogs[logIndex].huntingTime = parseInt(editTime);
        huntingLogs[logIndex].startExp = editStartExp;
        huntingLogs[logIndex].endExp = editEndExp;
        huntingLogs[logIndex].expGained = expGained;

        localStorage.setItem('mapleHuntingLogs', JSON.stringify(huntingLogs));
        editingLogId = null; 
        
        renderLogs();
        updateLevelSelectOptions();
        alert('기록이 수정되었습니다.');
    }

    function deleteLog(id, charName) {
        if (confirm(`[${charName}] 캐릭터의 해당 사냥 기록을 정말 삭제하시겠습니까?`)) {
            huntingLogs = huntingLogs.filter(log => log.id !== id);
            localStorage.setItem('mapleHuntingLogs', JSON.stringify(huntingLogs));
            renderLogs();
            updateLevelSelectOptions();
        }
    }

    const baseHuntingGrounds = ["켄타우로스의 원탁", "위험한 용의 둥지", "망가진 용의 둥지", "큰 둥지 봉우리"];

    function renderLogs() {
        const tableBody = document.getElementById('expTableBody');
        tableBody.innerHTML = ''; 
        let cumulativeTotalExp = 0;

        if (huntingLogs.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="7" style="color: #999;">아직 등록된 사냥 기록이 없습니다.</td></tr>`;
            document.getElementById('totalExpDisplay').innerText = "0 exp";
            document.getElementById('gaugeCharacterName').innerText = "캐릭터를 등록해 주세요";
            
            document.getElementById('mapleExpValue').innerText = "0 / 0";
            document.getElementById('mapleExpPercent').innerText = "[0.00%]";
            document.getElementById('mapleExpBarInner').style.width = '0%';
            return;
        }

        huntingLogs.forEach(log => { cumulativeTotalExp += log.expGained; });

        const latestLog = huntingLogs[huntingLogs.length - 1];
        let displayLevel = latestLog.level;
        let displayExp = latestLog.endExp;
        if (latestLog.isLevelUpLog && latestLog.level < 199) { displayLevel = latestLog.level + 1; }
        
        const latestMaxExp = expTableData[displayLevel];
        const latestEndPercent = (displayExp / latestMaxExp) * 100;
        
        document.getElementById('gaugeCharacterName').innerText = `🍁 ${latestLog.charName} (Lv.${displayLevel}) 현재 경험치 상태`;
        
        document.getElementById('mapleExpValue').innerText = `${displayExp.toLocaleString()} / ${latestMaxExp.toLocaleString()}`;
        document.getElementById('mapleExpPercent').innerText = `[${latestEndPercent.toFixed(2)}%]`;
        document.getElementById('mapleExpBarInner').style.width = `${latestEndPercent}%`;

        document.getElementById('totalExpDisplay').innerText = cumulativeTotalExp.toLocaleString() + " exp";

        const todayStr = getTodayString();
        const maxDateTimeLimit = getCurrentDateTimeLocalString(); 
        const reversedLogs = [...huntingLogs].reverse();

        reversedLogs.forEach(log => {
            const maxExp = expTableData[log.level];
            const startPercent = (log.startExp / maxExp) * 100;
            const newRow = document.createElement('tr');
            
            if ((log.dateOnly || log.fullDateTime.split(' ')[0]) === todayStr) {
                newRow.style.backgroundColor = '#fff7ed'; 
            }

            if (editingLogId === log.id) {
                const isCustomGround = !baseHuntingGrounds.includes(log.huntingGround);
                newRow.innerHTML = `
                    <td><input type="datetime-local" id="editDateTime-${log.id}" class="table-input" value="${log.fullDateTime.replace(' ', 'T')}" max="${maxDateTimeLimit}"></td>
                    <td>
                        <input type="text" id="editCharName-${log.id}" class="table-input" value="${log.charName}" style="margin-bottom:4px;"><br>
                        Lv. <input type="number" id="editLevel-${log.id}" class="table-input" value="${log.level}" min="1" max="199" style="width:60px; display:inline-block;">
                    </td>
                    <td>
                        <select id="editGroundSelect-${log.id}" class="table-input" onchange="
                            document.getElementById('editGroundCustomWrapper-${log.id}').style.display = (this.value==='custom') ? 'block' : 'none';
                        ">
                            <option value="켄타우로스의 원탁" ${log.huntingGround === '켄타우로스의 원탁' ? 'selected' : ''}>켄타우로스의 원탁</option>
                            <option value="위험한 용의 둥지" ${log.huntingGround === '위험한 용의 둥지' ? 'selected' : ''}>위험한 용의 둥지</option>
                            <option value="망가진 용의 둥지" ${log.huntingGround === '망가진 용의 둥지' ? 'selected' : ''}>망가진 용의 둥지</option>
                            <option value="큰 둥지 봉우리" ${log.huntingGround === '큰 둥지 봉우리' ? 'selected' : ''}>큰 둥지 봉우리</option>
                            <option value="custom" ${isCustomGround ? 'selected' : ''}>그 외 직접 입력</option>
                        </select>
                        <div id="editGroundCustomWrapper-${log.id}" style="display: ${isCustomGround ? 'block' : 'none'}; margin-top:4px;">
                            <input type="text" id="editGroundCustom-${log.id}" class="table-input" value="${isCustomGround ? log.huntingGround : ''}">
                        </div>
                    </td>
                    <td><input type="number" id="editTime-${log.id}" class="table-input" value="${log.huntingTime}" min="1"></td>
                    <td><span style="font-size:10px; color:#777;">종료수치:</span><input type="text" id="editEndExp-${log.id}" class="table-input" value="${formatNumberWithCommas(log.endExp)}"></td>
                    <td><span style="font-size:10px; color:#777;">시작수치:</span><input type="text" id="editStartExp-${log.id}" class="table-input" value="${formatNumberWithCommas(log.startExp)}"></td>
                    <td><button class="save-btn" onclick="saveEditLog(${log.id})">저장</button><button class="cancel-btn" onclick="cancelEditLog()">취소</button></td>
                `;
            } else {
                let gainedExpMarkup = log.isLevelUpLog 
                    ? `<span style="color: #ef4444; font-size: 11px; font-weight: bold;"><br>(레벨업 포함)</span>`
                    : `<span style="color: #2563eb; font-size: 11px;"><br>(+${((log.endExp / maxExp * 100) - startPercent).toFixed(2)}%)</span>`;

                newRow.innerHTML = `
                    <td style="color: #555; font-size: 13px;">${log.fullDateTime}</td>
                    <td>${log.charName} (Lv.${log.level}${log.isLevelUpLog ? ' → ' + (log.level+1) : ''})</td>
                    <td><strong>${log.huntingGround}</strong></td>
                    <td>${log.huntingTime}분</td>
                    <td><span style="color: #e68a00; font-weight: bold;">+${log.expGained.toLocaleString()}</span>${gainedExpMarkup}</td>
                    <td><span style="color: #555;">${log.startExp.toLocaleString()}</span><br><span style="color: #888; font-size: 12px;">(${startPercent.toFixed(2)}%)</span></td>
                    <td><button class="edit-btn" onclick="startEditLog(${log.id})">수정</button><button class="delete-btn" onclick="deleteLog(${log.id}, '${log.charName}')">삭제</button></td>
                `;
            }
            tableBody.appendChild(newRow);
        });
    }
</script>

</body>
</html>
